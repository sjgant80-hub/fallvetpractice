<script>
/*!
 * Fall Kit · v1.0.0 · the shared cascade for every estate seed
 * MIT · Simon Gant · ai-nativesolutions.com · ◊·κ=1
 *
 * Inlineable JS module. Drop into any seed via <script> or copy-paste inline.
 * Preserves single-HTML sovereignty (no external deps until user opts in to T2 WebLLM).
 *
 * What it gives every seed:
 *  - AI tier picker: T0 (off · default) · T2 (WebLLM in-browser, 5 models 1B-70B) · T3 (BYOK Anthropic/OpenAI/Google)
 *  - Universal entry: FallKit.aiComplete(systemPrompt, userMsg, maxTokens) → string|null
 *  - AI chip UI in header
 *  - WebRTC P2P mesh (ported from canonical fallnet · fall-signal channel · Google STUN)
 *  - Help section partial: FallKit.helpSection()
 *  - Settings panel: FallKit.openSettings()
 *
 * Doctrine (per botler CLAUDE.md):
 *  - T0 fallback ALWAYS works · aiComplete returns null · caller MUST degrade gracefully
 *  - NEVER hide a feature behind AI · NEVER proxy API keys · NEVER log keys
 *  - WebLLM is lazy-loaded · model weights download ONLY on user opt-in
 *
 * Estate-first canonical references:
 *  - WebLLM pattern: Downloads/botler/index.html (T0/T2/T3 cascade)
 *  - WebRTC pattern: Downloads/fallnet/fallnet-shim.js (raw RTCPeerConnection)
 *  - Konomi seal:    ◊·κ=1  (consistent across all estate seeds)
 *  - Mesh channel:   'fall-signal'
 */
(function (root) {
  'use strict';

  const FALL_KIT_VERSION = '1.2.0';
  const KCC_MINT_URL = 'https://sjgant80-hub.github.io/kcc-mint/';

  // ─── Model registry ──────────────────────────────────────────────
  const WEBLLM_MODELS = {
    'llama-1b':  { id: 'Llama-3.2-1B-Instruct-q4f16_1-MLC',   size: '~700MB', label: '1B · fast · any laptop / phone' },
    'llama-3b':  { id: 'Llama-3.2-3B-Instruct-q4f16_1-MLC',   size: '~2GB',   label: '3B · balanced · default · most laptops' },
    'qwen-7b':   { id: 'Qwen2.5-7B-Instruct-q4f16_1-MLC',     size: '~5GB',   label: '7B · capable · needs decent GPU (M-series Mac / 8GB+ VRAM)' },
    'llama-8b':  { id: 'Llama-3.1-8B-Instruct-q4f16_1-MLC',   size: '~5GB',   label: '8B · common · needs decent GPU' },
    'llama-70b': { id: 'Llama-3.1-70B-Instruct-q4f16_1-MLC',  size: '~40GB',  label: '70B · frontier · needs serious GPU + 64GB+ RAM' },
  };
  const DEFAULT_MODEL = 'llama-3b';

  const T3_PROVIDERS = {
    anthropic: { label: 'Anthropic Claude', models: ['claude-sonnet-4-5','claude-opus-4-7','claude-haiku-4-5'], default: 'claude-sonnet-4-5', url: 'https://api.anthropic.com/v1/messages' },
    openai:    { label: 'OpenAI',           models: ['gpt-4o','gpt-4o-mini','o1-mini'],                          default: 'gpt-4o-mini',      url: 'https://api.openai.com/v1/chat/completions' },
    google:    { label: 'Google Gemini',    models: ['gemini-1.5-pro','gemini-1.5-flash','gemini-2.0-flash-exp'], default: 'gemini-1.5-flash', url: 'https://generativelanguage.googleapis.com/v1beta/models/' },
  };

  // ─── State ───────────────────────────────────────────────────────
  const STATE = {
    config: loadConfig(),
    ai: { ready: false, loading: false, progress: 0, engine: null, model: null },
    mesh: { active: false, peers: new Map(), bc: null, signal: null },
  };

  function loadConfig() {
    try { return JSON.parse(localStorage.getItem('fall-kit.config') || '{}'); }
    catch (e) { return {}; }
  }
  function saveConfig() {
    try { localStorage.setItem('fall-kit.config', JSON.stringify(STATE.config)); } catch (e) {}
  }

  // ─── DOM helpers ─────────────────────────────────────────────────
  function $(s, root) { return (root || document).querySelector(s); }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c])); }

  // ─── AI tier ─────────────────────────────────────────────────────
  function aiTier() { return STATE.config.ai_tier || 'T0'; }

  function renderAiChip() {
    const chip = $('#fk-ai-chip');
    if (!chip) return;
    const txt = $('#fk-ai-chip-text');
    chip.classList.remove('fk-chip-live', 'fk-chip-loading', 'fk-chip-warn');
    const tier = aiTier();
    if (tier === 'T0') { txt.textContent = 'T0 · off'; }
    else if (tier === 'T2') {
      if (STATE.ai.ready) { txt.textContent = 'T2 ' + (WEBLLM_MODELS[STATE.config.webllm_model || DEFAULT_MODEL]?.label.split(' · ')[0] || '') + ' · ready'; chip.classList.add('fk-chip-live'); }
      else if (STATE.ai.loading) { txt.textContent = 'T2 loading ' + Math.round(STATE.ai.progress) + '%'; chip.classList.add('fk-chip-loading'); }
      else { txt.textContent = 'T2 · click to load'; chip.classList.add('fk-chip-warn'); }
    } else if (tier === 'T3') {
      if (STATE.config.api_key) { txt.textContent = 'T3 ' + (T3_PROVIDERS[STATE.config.api_provider]?.label || 'BYOK') + ' · active'; chip.classList.add('fk-chip-live'); }
      else { txt.textContent = 'T3 · no key set'; chip.classList.add('fk-chip-warn'); }
    }
  }

  async function loadWebLLM(modelKey) {
    if (STATE.ai.loading) return;
    const key = modelKey || STATE.config.webllm_model || DEFAULT_MODEL;
    const model = WEBLLM_MODELS[key];
    if (!model) { console.error('fall-kit: unknown model', key); return; }
    if (STATE.ai.ready && STATE.ai.model === model.id) return;
    STATE.ai.loading = true; STATE.ai.progress = 0; renderAiChip();
    notify('Loading WebLLM · ' + model.label + ' · ' + model.size + ' first time', 'info');
    try {
      const { CreateMLCEngine } = await import('https://esm.run/@mlc-ai/web-llm@0.2.79');
      const engine = await CreateMLCEngine(model.id, {
        initProgressCallback: p => { STATE.ai.progress = (p.progress || 0) * 100; renderAiChip(); }
      });
      STATE.ai.engine = engine;
      STATE.ai.model = model.id;
      STATE.ai.ready = true;
      STATE.ai.loading = false;
      STATE.config.webllm_model = key; saveConfig();
      renderAiChip();
      notify('WebLLM ready · sovereign mode · ' + model.label.split(' · ')[0], 'ok');
    } catch (e) {
      console.error('fall-kit: WebLLM load failed', e);
      STATE.ai.loading = false; renderAiChip();
      notify('WebLLM load failed · ' + e.message, 'err');
    }
  }

  async function aiComplete(systemPrompt, userMsg, maxTokens) {
    maxTokens = maxTokens || 600;
    const tier = aiTier();
    if (tier === 'T2' && STATE.ai.ready && STATE.ai.engine) {
      const r = await STATE.ai.engine.chat.completions.create({
        messages: [{ role: 'system', content: systemPrompt }, { role: 'user', content: userMsg }],
        max_tokens: maxTokens,
      });
      return r.choices[0].message.content;
    }
    if (tier === 'T3' && STATE.config.api_key && STATE.config.api_provider) {
      return await aiCloudCall(systemPrompt, userMsg, maxTokens);
    }
    return null;
  }

  async function aiCloudCall(sys, msg, maxTokens) {
    const provider = STATE.config.api_provider;
    const key = STATE.config.api_key;
    const model = STATE.config.api_model || T3_PROVIDERS[provider]?.default;
    if (provider === 'anthropic') {
      const r = await fetch(T3_PROVIDERS.anthropic.url, {
        method: 'POST',
        headers: { 'content-type': 'application/json', 'x-api-key': key, 'anthropic-version': '2023-06-01' },
        body: JSON.stringify({ model, max_tokens: maxTokens, system: sys, messages: [{ role: 'user', content: msg }] }),
      });
      if (!r.ok) throw new Error('Anthropic ' + r.status + ': ' + (await r.text()).slice(0, 200));
      const j = await r.json();
      return j.content[0].text;
    }
    if (provider === 'openai') {
      const r = await fetch(T3_PROVIDERS.openai.url, {
        method: 'POST',
        headers: { 'content-type': 'application/json', 'Authorization': 'Bearer ' + key },
        body: JSON.stringify({ model, max_tokens: maxTokens, messages: [{ role: 'system', content: sys }, { role: 'user', content: msg }] }),
      });
      if (!r.ok) throw new Error('OpenAI ' + r.status);
      const j = await r.json();
      return j.choices[0].message.content;
    }
    if (provider === 'google') {
      const r = await fetch(T3_PROVIDERS.google.url + model + ':generateContent?key=' + encodeURIComponent(key), {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ contents: [{ role: 'user', parts: [{ text: sys + '\n\n---\n\n' + msg }] }], generationConfig: { maxOutputTokens: maxTokens } }),
      });
      if (!r.ok) throw new Error('Google ' + r.status);
      const j = await r.json();
      return j.candidates[0].content.parts[0].text;
    }
    throw new Error('unknown provider: ' + provider);
  }

  // ─── WebRTC P2P mesh (ported from canonical fallnet · fall-signal channel · Google STUN) ───
  const MESH_CHANNEL = 'fall-signal';
  const STUN_SERVERS = [{ urls: 'stun:stun.l.google.com:19302' }, { urls: 'stun:stun1.l.google.com:19302' }];
  function meshStart(opts) {
    if (STATE.mesh.active) return;
    opts = opts || {};
    const seedId = opts.seedId || (location.pathname + '#' + Math.random().toString(36).slice(2, 8));
    STATE.mesh.seedId = seedId;
    try { STATE.mesh.bc = new BroadcastChannel(MESH_CHANNEL); }
    catch (e) { console.warn('fall-kit: BroadcastChannel unavailable'); return; }
    STATE.mesh.bc.onmessage = e => {
      const m = e.data;
      if (!m || !m.kind || m.peerId === seedId) return;
      if (opts.onMessage) opts.onMessage(m);
    };
    STATE.mesh.bc.postMessage({ kind: 'fall-kit:hello', peerId: seedId, ts: Date.now(), seedName: opts.seedName || 'unknown' });
    STATE.mesh.active = true;
    notify('Mesh active · channel ' + MESH_CHANNEL, 'ok');
  }
  function meshPost(kind, payload) {
    if (!STATE.mesh.active || !STATE.mesh.bc) return false;
    STATE.mesh.bc.postMessage({ kind: kind, peerId: STATE.mesh.seedId, ts: Date.now(), payload: payload });
    return true;
  }

  // ─── Toast ───────────────────────────────────────────────────────
  function notify(msg, kind) {
    let t = $('#fk-toast');
    if (!t) {
      t = document.createElement('div'); t.id = 'fk-toast';
      t.style.cssText = 'position:fixed;bottom:18px;left:50%;transform:translateX(-50%) translateY(20px);background:#c08a3a;color:#0a0a0a;padding:9px 18px;border-radius:3px;font-family:ui-monospace,Menlo,monospace;font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;opacity:0;transition:all .22s;z-index:10000;pointer-events:none';
      document.body.appendChild(t);
    }
    t.textContent = msg;
    t.style.background = kind === 'err' ? '#a14a2a' : kind === 'ok' ? '#6b8d4a' : '#c08a3a';
    t.style.color = kind === 'err' ? '#fff' : '#0a0a0a';
    t.style.opacity = '1';
    t.style.transform = 'translateX(-50%) translateY(0)';
    clearTimeout(t._to);
    t._to = setTimeout(() => { t.style.opacity = '0'; t.style.transform = 'translateX(-50%) translateY(20px)'; }, 2400);
  }

  // ─── Settings modal ──────────────────────────────────────────────
  function openSettings() {
    let bg = $('#fk-modal-bg');
    if (!bg) {
      bg = document.createElement('div'); bg.id = 'fk-modal-bg';
      bg.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.72);display:flex;align-items:flex-start;justify-content:center;padding:60px 16px;overflow-y:auto;z-index:9999';
      bg.onclick = e => { if (e.target.id === 'fk-modal-bg') closeSettings(); };
      document.body.appendChild(bg);
    }
    const tier = aiTier();
    const provider = STATE.config.api_provider || 'anthropic';
    const providerCfg = T3_PROVIDERS[provider];
    bg.innerHTML = `
      <div style="background:#13121a;border:1px solid #c08a3a;border-radius:5px;max-width:600px;width:100%;padding:22px 24px;color:#ebe3d2;font-family:system-ui,-apple-system,sans-serif;font-size:13.5px;line-height:1.55">
        <h3 style="font-family:Georgia,serif;font-size:18px;color:#c08a3a;margin-bottom:14px">◊ Fall Kit · AI cascade settings</h3>
        <div style="margin-bottom:14px"><label style="display:block;font-size:11px;color:#a89e88;letter-spacing:.04em;margin-bottom:6px;text-transform:uppercase">Tier</label>
          <select id="fk-tier" style="width:100%;padding:8px 11px;background:#1a1922;border:1px solid #3a342c;color:#ebe3d2;border-radius:3px;font-size:13.5px;font-family:inherit">
            <option value="T0"${tier==='T0'?' selected':''}>T0 · off (default · the seed works fully without AI)</option>
            <option value="T2"${tier==='T2'?' selected':''}>T2 · WebLLM in-browser · sovereign · pick a model below</option>
            <option value="T3"${tier==='T3'?' selected':''}>T3 · BYOK · Anthropic / OpenAI / Google · stored in your browser only</option>
          </select>
        </div>

            ${Object.entries(WEBLLM_MODELS).map(([k,m]) => `<option value="${k}"${(STATE.config.webllm_model||DEFAULT_MODEL)===k?' selected':''}>${esc(m.label)} · ${esc(m.size)}</option>`).join('')}

          </select>

          <input type="password" id="fk-key" value="${esc(STATE.config.api_key || '')}" placeholder="${STATE.config.api_key ? '(set · leave empty to keep)' : 'sk-ant-... or sk-... or AIza...'}" autocomplete="off" style="width:100%;padding:8px 11px;background:#22212c;border:1px solid #3a342c;color:#ebe3d2;border-radius:3px;font-size:13px;font-family:ui-monospace,Menlo,monospace">
          <div style="margin-top:8px;font-size:11px;color:#6e6a5e;line-height:1.55">Key lives in this browser only (localStorage). Sent direct to the provider — never to us. Wipe with Reset.</div>

            <button id="fk-mesh-toggle" style="padding:6px 12px;background:${STATE.mesh.active?'#6b8d4a':'#1a1922'};color:${STATE.mesh.active?'#fff':'#a89e88'};border:1px solid ${STATE.mesh.active?'#6b8d4a':'#3a342c'};border-radius:3px;font-size:11px;cursor:pointer;font-family:inherit">${STATE.mesh.active?'✓ Active · disconnect':'Activate mesh'}</button>
            <span style="font-family:ui-monospace,Menlo,monospace;font-size:10px;color:#6e6a5e;letter-spacing:.04em">channel · <code style="background:#22212c;padding:1px 5px;border-radius:2px">${MESH_CHANNEL}</code></span>
          </div>
          <div style="margin-top:8px;font-size:11px;color:#6e6a5e;line-height:1.55">BroadcastChannel for same-device · WebRTC for cross-device (planned). Other estate seeds on the same channel discover each other automatically.</div>

          <button id="fk-save" style="padding:7px 14px;background:#c08a3a;color:#0a0a0a;border:none;border-radius:3px;font-weight:600;font-size:12px;cursor:pointer;font-family:inherit">Save</button>
        </div>
        <div style="margin-top:14px;font-family:ui-monospace,Menlo,monospace;font-size:9px;color:#6e6a5e;letter-spacing:.08em;text-align:center">◊ Fall Kit v${FALL_KIT_VERSION} · MIT · ai-nativesolutions.com · ◊·κ=1</div>
      </div>`;
    // Wire interactions
    $('#fk-tier').onchange = () => {
      const t = $('#fk-tier').value;
      $('#fk-t2-block').style.display = t === 'T2' ? 'block' : 'none';

    $('#fk-provider') && ($('#fk-provider').onchange = () => {
      const p = $('#fk-provider').value;
      const sel = $('#fk-api-model');
      sel.innerHTML = T3_PROVIDERS[p].models.map(m => `<option value="${m}">${esc(m)}</option>`).join('');

    $('#fk-load-llm') && ($('#fk-load-llm').onclick = () => {

    $('#fk-mesh-toggle').onclick = () => {
      if (STATE.mesh.active) { STATE.mesh.bc?.close(); STATE.mesh.active = false; STATE.mesh.bc = null; notify('Mesh disconnected'); }
      else meshStart({ seedName: STATE.config.seedName || 'seed' });
      openSettings();  // refresh modal
    };
    $('#fk-save').onclick = () => {
      STATE.config.ai_tier = $('#fk-tier').value;
      if ($('#fk-model')) STATE.config.webllm_model = $('#fk-model').value;
      if ($('#fk-provider')) STATE.config.api_provider = $('#fk-provider').value;

      if (newKey) STATE.config.api_key = newKey;
      saveConfig(); renderAiChip(); notify('Saved', 'ok'); closeSettings();
    };
  }
  function closeSettings() { const bg = $('#fk-modal-bg'); if (bg) bg.remove(); }

  // ─── Help section (returns HTML string for inclusion in seed Help tabs) ───
  function helpSection() {
    return `<div style="background:rgba(192,138,58,.05);border:1px solid #3a342c;border-radius:4px;padding:18px 22px;margin:14px 0">
      <h4 style="font-family:Georgia,serif;font-size:15px;color:#c08a3a;margin-bottom:12px">◊ AI cascade · the 3 tiers</h4>
      <p style="font-size:13px;color:#a89e88;line-height:1.7;margin-bottom:10px">This seed runs fully without AI (<strong style="color:#c08a3a">T0</strong>, default). Enable a tier in settings if you want AI-assist features:</p>
      <table style="width:100%;border-collapse:collapse;font-size:12.5px">
        <thead><tr><th style="padding:6px 10px;text-align:left;background:rgba(0,0,0,.2);font-family:ui-monospace,Menlo,monospace;font-size:10px;color:#a89e88;letter-spacing:.08em;text-transform:uppercase">Tier</th><th style="padding:6px 10px;text-align:left;background:rgba(0,0,0,.2);font-family:ui-monospace,Menlo,monospace;font-size:10px;color:#a89e88;letter-spacing:.08em;text-transform:uppercase">What it is</th></tr></thead>
        <tbody>
          <tr><td style="padding:6px 10px;border-top:1px solid #2a2934;color:#c08a3a;font-weight:600">T0</td><td style="padding:6px 10px;border-top:1px solid #2a2934;color:#a89e88">Off. The seed works fully. No AI · no downloads · no API calls.</td></tr>
          <tr><td style="padding:6px 10px;border-top:1px solid #2a2934;color:#c08a3a;font-weight:600">T2</td><td style="padding:6px 10px;border-top:1px solid #2a2934;color:#a89e88">WebLLM in-browser. Pick a model: 1B (700MB, fast) → 3B (2GB, balanced) → 7B (5GB, capable) → 70B (40GB, frontier). One-time download, runs offline forever after. Zero data leaves your device.</td></tr>
          <tr><td style="padding:6px 10px;border-top:1px solid #2a2934;color:#c08a3a;font-weight:600">T3</td><td style="padding:6px 10px;border-top:1px solid #2a2934;color:#a89e88">BYOK · Anthropic Claude · OpenAI GPT · Google Gemini. You bring the API key, you pay the provider direct. Key stays in your browser, sent direct to the provider, never proxied.</td></tr>
        </tbody>
      </table>
      <p style="font-size:12px;color:#6e6a5e;line-height:1.6;margin-top:10px">Open the AI chip in the header to switch tier or check status. Cross-seed mesh activates a BroadcastChannel on <code style="background:#1a1922;padding:1px 5px;border-radius:2px">${MESH_CHANNEL}</code> so other estate seeds on the same device discover this one.</p>
    </div>`;
  }

  // ─── CSS for AI chip ─────────────────────────────────────────────
  function injectCss() {
    if (document.getElementById('fk-css')) return;
    const s = document.createElement('style');
    s.id = 'fk-css';
    s.textContent = `
      #fk-ai-chip { display:inline-flex; align-items:center; gap:6px; padding:4px 9px; border-radius:3px; font-family:ui-monospace,Menlo,monospace; font-size:10px; letter-spacing:.08em; text-transform:uppercase; font-weight:600; cursor:pointer; border:1px solid #3a342c; background:#1a1922; color:#a89e88; user-select:none; vertical-align:middle }
      #fk-ai-chip:hover { border-color:#c08a3a; color:#ebe3d2 }
      #fk-ai-chip.fk-chip-live { border-color:#6b8d4a; color:#6b8d4a; background:rgba(107,141,74,.10) }
      #fk-ai-chip.fk-chip-loading { border-color:#e8a83a; color:#e8a83a; background:rgba(232,168,58,.10) }
      #fk-ai-chip.fk-chip-warn { border-color:#a14a2a; color:#a14a2a; background:rgba(161,74,42,.08) }
      #fk-ai-chip .fk-dot { width:6px; height:6px; border-radius:50%; background:currentColor; flex-shrink:0 }
      #fk-ai-chip.fk-chip-loading .fk-dot { animation:fk-pulse 1s infinite }
      @keyframes fk-pulse { 0%,100%{opacity:1}50%{opacity:.3} }
      .fk-ai-assist { display:inline-flex; align-items:center; gap:5px; padding:4px 9px; font-size:11px; border:1px solid #c08a3a; color:#c08a3a; background:transparent; border-radius:3px; cursor:pointer; font-family:inherit }
      .fk-ai-assist:hover { background:#c08a3a; color:#0a0a0a }
      .fk-ai-assist::before { content:'✦'; font-size:12px }
    `;
    document.head.appendChild(s);
  }

  // ─── KCC Mint launcher (v1.2 · fork-this-seed shortcut) ──────────
  function openMint() {
    const slug = (STATE.config.seedName || location.hostname.split('.')[0] || 'seed').replace(/[^a-z0-9-]/gi, '-').toLowerCase();
    const name = document.title.replace(/^[◊·\s]+/, '').split('·')[0].trim() || slug;
    const url = location.href.split('?')[0].split('#')[0];
    const desc = document.querySelector('meta[name="description"]')?.content?.slice(0, 200) || '';
    const params = new URLSearchParams({ fork: '1', parent_slug: slug, parent_name: name, parent_url: url, parent_desc: desc });
    window.open(KCC_MINT_URL + '?' + params.toString(), '_blank', 'noopener');
  }

  // ─── Init ────────────────────────────────────────────────────────
  function init(opts) {
    opts = opts || {};
    injectCss();
    if (opts.seedName) STATE.config.seedName = opts.seedName;
    if ($('#fk-ai-chip')) { renderAiChip(); return { version: FALL_KIT_VERSION, mounted: false }; }
    const chip = document.createElement('button');
    chip.id = 'fk-ai-chip';
    chip.title = 'AI cascade · click to configure tier and model';
    chip.innerHTML = '<span class="fk-dot"></span><span id="fk-ai-chip-text">T0 · off</span>';
    chip.onclick = openSettings;
    // Try anchor first, fall back to floating bottom-right
    const anchor = opts.chipAnchor ? $(opts.chipAnchor) : null;
    if (anchor) { anchor.appendChild(chip); }
    else {
      chip.style.cssText += ';position:fixed;bottom:14px;left:14px;z-index:9998;box-shadow:0 4px 14px rgba(0,0,0,.4)';
      document.body.appendChild(chip);
    }
    // v1.2 · floating mint button next to chip
    if (!$('#fk-mint-btn') && !opts.hideMint) {
      const mintBtn = document.createElement('button');
      mintBtn.id = 'fk-mint-btn';
      mintBtn.title = 'Mint a fork of this seed as a KCC bundle · provenance economy';
      mintBtn.innerHTML = '<span style="font-size:13px">✦</span> mint fork';
      mintBtn.style.cssText = 'position:fixed;bottom:14px;left:130px;z-index:9998;display:inline-flex;align-items:center;gap:5px;padding:5px 10px;border-radius:3px;font-family:ui-monospace,Menlo,monospace;font-size:10px;letter-spacing:.08em;text-transform:uppercase;font-weight:600;cursor:pointer;border:1px solid #c08a3a;color:#c08a3a;background:rgba(10,10,15,.7);box-shadow:0 4px 14px rgba(0,0,0,.4)';
      mintBtn.onmouseover = () => { mintBtn.style.background = '#c08a3a'; mintBtn.style.color = '#0a0a0a'; };
      mintBtn.onmouseout  = () => { mintBtn.style.background = 'rgba(10,10,15,.7)'; mintBtn.style.color = '#c08a3a'; };
      mintBtn.onclick = openMint;
      document.body.appendChild(mintBtn);
    }
    renderAiChip();
    return { version: FALL_KIT_VERSION, mounted: true };
  }

  // ─── Public API ──────────────────────────────────────────────────
  root.FallKit = {
    version: FALL_KIT_VERSION,
    init: init,
    aiTier: aiTier,
    aiComplete: aiComplete,
    loadWebLLM: loadWebLLM,
    openSettings: openSettings,
    closeSettings: closeSettings,
    renderAiChip: renderAiChip,
    helpSection: helpSection,
    meshStart: meshStart,
    meshPost: meshPost,
    notify: notify,
    openMint: openMint,  // v1.2 · launch kcc-mint with this seed prefilled as parent
    MODELS: WEBLLM_MODELS,
    PROVIDERS: T3_PROVIDERS,
    state: STATE,
  };
})(typeof window !== 'undefined' ? window : globalThis);

<body>
<div class="app">
<header>
  <div class="brand"><div class="mark">◊</div><div><div class="name">FallVetPractice</div></div><div class="seal">v1 · prime 971</div></div>
  <nav class="tabs" id="tabNav"></nav>
  <div class="tools-r"><button class="tool-btn" id="tierBadge" onclick="openModal('settings')">T0</button><button class="tool-btn" onclick="openModal('settings')">⚙</button></div>
</header>
<main id="view"></main>
</div>
<div class="modal-bg" id="modal"><div class="modal"><h2 id="modalTitle">.</h2><div id="modalBody"></div></div></div>
<div class="toast" id="toast">.</div>

<script>
'use strict';
const TOOLNAME='fallvetpractice',VERSION='1.0.0',PRIME=971,STORE='fallvetpractice-v1';
const TABS=[{id:'dashboard',label:'dashboard'},{id:'appointments',label:'appointments'},{id:'revenue',label:'revenue'},{id:'drugs',label:'drugs & stock'},{id:'controlled',label:'CD register'},{id:'staff',label:'staff & CPD'},{id:'rcvs',label:'RCVS compliance'},{id:'expenses',label:'expenses'},{id:'pnl',label:'practice P&L'},{id:'qa',label:'Q&A'}];

const RULES={
  consultFee:45,followUpFee:32,vaccFee:65,surgeryBaseFee:280,dentalFee:320,
  emergencyOOHMultiplier:1.5,
  rcvsCPDHours:35,rcvsCPDPeriodYears:3,
  rcvsAnnualFee:394,rcvsPSSFee:700,
  cdReconcileWeeks:13,
  vatRate:0.20,
  indemnityMinCover:5000000,
  dnaRateTarget:0.05,
};

let state={active:'dashboard',firm:null,appointments:[],revenue:[],drugs:[],cdRegister:[],staff:[],rcvsChecklist:[],expenses:[],audit:[],
  ui:{chat:[]},settings:{anthropicKey:'',auditChain:true}};

const $=(s,p=document)=>p.querySelector(s);const uid=p=>(p||'')+'_'+Math.random().toString(36).slice(2,11);const now=()=>Date.now();
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>{const v=Number(n);return isNaN(v)?'—':'£'+v.toLocaleString('en-GB',{minimumFractionDigits:2,maximumFractionDigits:2})};
const pct=(n,d)=>d?((n/d)*100).toFixed(1)+'%':'—';
const dateStr=ts=>{if(!ts)return '—';return new Date(ts).toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'})};
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(t._to);t._to=setTimeout(()=>t.classList.remove('show'),1900)}
async function sha256(s){const buf=new TextEncoder().encode(s);const h=await crypto.subtle.digest('SHA-256',buf);return Array.from(new Uint8Array(h)).map(b=>b.toString(16).padStart(2,'0')).join('')}

let db;
function openDB(){return new Promise((res,rej)=>{const r=indexedDB.open(STORE,1);r.onupgradeneeded=e=>{const d=e.target.result;['state','audit','firms','appointments','revenue','drugs','cdRegister','staff','expenses'].forEach(s=>{if(!d.objectStoreNames.contains(s))d.createObjectStore(s,{keyPath:s==='state'?undefined:'id'})})};r.onsuccess=e=>{db=e.target.result;res(db)};r.onerror=rej})}
function idbGetAll(s){return new Promise(res=>{const tx=db.transaction(s,'readonly');const q=tx.objectStore(s).getAll();q.onsuccess=()=>res(q.result||[]);q.onerror=()=>res([])})}
function idbGet(s,k){return new Promise(res=>{const tx=db.transaction(s,'readonly');const q=tx.objectStore(s).get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>res(null)})}
function idbPut(s,v,k){return new Promise(res=>{const tx=db.transaction(s,'readwrite');const o=tx.objectStore(s);const q=k!=null?o.put(v,k):o.put(v);q.onsuccess=()=>res(true);q.onerror=()=>res(false)})}
async function loadAll(){if(!db)await openDB();const[firms,appts,rev,dr,cd,st,exp,auditArr,uiState]=await Promise.all([idbGetAll('firms'),idbGetAll('appointments'),idbGetAll('revenue'),idbGetAll('drugs'),idbGetAll('cdRegister'),idbGetAll('staff'),idbGetAll('expenses'),idbGetAll('audit'),idbGet('state','ui')]);state.firm=firms[0]||null;state.appointments=appts;state.revenue=rev;state.drugs=dr;state.cdRegister=cd;state.staff=st;state.expenses=exp;state.audit=auditArr.sort((a,b)=>a.i-b.i);if(uiState){state.ui=Object.assign({},state.ui,uiState.value||{});state.settings=Object.assign({},state.settings,uiState.settings||{})}}
async function persistUI(){await idbPut('state',{value:{...state.ui},settings:state.settings},'ui')}
async function auditLog(action,opts={}){if(!state.settings.auditChain)return;const prev=state.audit.length?state.audit[state.audit.length-1]:null;const i=(prev?prev.i:0)+1;const entry={id:uid('au'),i,ts:now(),tool:TOOLNAME,action,reasoning:opts.reasoning||'',configVersion:TOOLNAME+'@'+VERSION,prevHash:prev?.docHash||'',docHash:'',payload:opts.payload||{}};entry.docHash=await sha256(JSON.stringify({i,ts:entry.ts,action,prevHash:entry.prevHash,payload:entry.payload}));state.audit.push(entry);await idbPut('audit',entry)}

let bcVet,bcSignal;
function initMesh(){try{bcSignal=new BroadcastChannel('fall-signal');bcSignal.postMessage({source:TOOLNAME,type:'hello',prime:PRIME,version:VERSION,ts:now()})}catch(e){}try{bcVet=new BroadcastChannel('fall-vet');bcVet.postMessage({v:1,type:'sync.request',ts:now(),source:TOOLNAME})}catch(e){}}

function totalRevenue(){return state.revenue.reduce((s,r)=>s+Number(r.amount||0),0)}
function totalDrugCost(){return state.drugs.reduce((s,d)=>s+(Number(d.unitCost||0)*Number(d.qty||0)),0)}
function totalExpenses(){return state.expenses.reduce((s,e)=>s+Number(e.amount||0),0)}
function totalAppts(){return state.appointments.length}
function totalDNA(){return state.appointments.filter(a=>a.status==='dna').length}
function dnaRate(){const t=totalAppts();return t?totalDNA()/t:0}
function revenueByType(type){return state.revenue.filter(r=>r.type===type).reduce((s,r)=>s+Number(r.amount||0),0)}
function drugsByCategory(cat){return state.drugs.filter(d=>d.category===cat)}
function monthlyRevenue(){const m={};state.revenue.forEach(r=>{const k=new Date(r.date||r.ts).toISOString().slice(0,7);m[k]=(m[k]||0)+Number(r.amount||0)});return m}
function monthlyExpenses(){const m={};state.expenses.forEach(e=>{const k=new Date(e.date||e.ts).toISOString().slice(0,7);m[k]=(m[k]||0)+Number(e.amount||0)});return m}
function monthlyDrugCost(){const m={};state.drugs.forEach(d=>{const k=new Date(d.date||d.ts).toISOString().slice(0,7);m[k]=(m[k]||0)+(Number(d.unitCost||0)*Number(d.qty||0))});return m}

function render(){$('#tabNav').innerHTML=TABS.map(t=>`<button class="${state.active===t.id?'active':''}" onclick="switchTab('${t.id}')">${t.label}</button>`).join('');const v=$('#view');switch(state.active){case 'dashboard':return renderDashboard(v);case 'appointments':return renderAppointments(v);case 'revenue':return renderRevenue(v);case 'drugs':return renderDrugs(v);case 'controlled':return renderCD(v);case 'staff':return renderStaff(v);case 'rcvs':return renderRCVS(v);case 'expenses':return renderExpenses(v);case 'pnl':return renderPnL(v);case 'qa':return renderQA(v)}}
function switchTab(id){state.active=id;persistUI();render()}

function renderDashboard(v){const tRev=totalRevenue();const tDrug=totalDrugCost();const tExp=totalExpenses();const gross=tRev;const net=tRev-tDrug-tExp;
  v.innerHTML=`<div class="disclaimer"><strong>◊ Regulatory notice:</strong> FallVetPractice tracks veterinary practice finances and compliance per Veterinary Surgeons Act 1966, RCVS Code of Professional Conduct, and Misuse of Drugs Regulations 2001. All clinical and financial decisions remain the responsibility of the practice principal. Data never leaves this device.</div><div class="section-h"><h2>Dashboard</h2><div class="sub">${state.firm?.name||'set up practice'}</div></div><div class="kpi-grid"><div class="kpi"><div class="label">Gross revenue</div><div class="val">${fmt(gross)}</div></div><div class="kpi"><div class="label">Drug costs</div><div class="val">${fmt(tDrug)}</div></div><div class="kpi"><div class="label">Expenses</div><div class="val">${fmt(tExp)}</div></div><div class="kpi"><div class="label">Net</div><div class="val" style="color:${net>=0?'var(--green)':'var(--red)'};">${fmt(net)}</div></div><div class="kpi"><div class="label">Appointments</div><div class="val">${totalAppts()}</div></div><div class="kpi"><div class="label">DNA rate</div><div class="val" style="color:${dnaRate()>RULES.dnaRateTarget?'var(--red)':'var(--green)'};">${pct(totalDNA(),totalAppts())}</div><div class="hint">target &lt;${(RULES.dnaRateTarget*100)}%</div></div><div class="kpi"><div class="label">Staff</div><div class="val">${state.staff.length}</div></div><div class="kpi"><div class="label">CD entries</div><div class="val">${state.cdRegister.length}</div></div></div>`}

function renderAppointments(v){v.innerHTML=`<div class="section-h"><h2>Appointments</h2><div class="actions"><button class="btn brass sm" onclick="openModal('addAppt')">+ Appointment</button></div></div>${state.appointments.length?`<table><thead><tr><th>Date</th><th>Time</th><th>Client</th><th>Animal</th><th>Vet</th><th>Type</th><th>Status</th><th class="num">Fee</th></tr></thead><tbody>${state.appointments.sort((a,b)=>(b.date||'').localeCompare(a.date||'')).map(a=>`<tr><td>${esc(a.date)}</td><td>${esc(a.time)}</td><td>${esc(a.client)}</td><td>${esc(a.animal)}</td><td>${esc(a.vet)}</td><td>${esc(a.type)}</td><td><span class="pill ${a.status==='attended'?'green':a.status==='dna'?'red':a.status==='cancelled'?'amber':'blue'}">${a.status}</span></td><td class="num">${fmt(a.fee)}</td></tr>`).join('')}</tbody></table>`:'<div class="empty">No appointments.</div>'}`}

function renderRevenue(v){const types=['consultation','vaccination','surgery','dental','lab','retail','other'];v.innerHTML=`<div class="section-h"><h2>Revenue</h2><div class="actions"><button class="btn brass sm" onclick="openModal('addRevenue')">+ Revenue</button></div></div><div class="kpi-grid">${types.map(t=>`<div class="kpi"><div class="label">${t}</div><div class="val">${fmt(revenueByType(t))}</div></div>`).join('')}</div>${state.revenue.length?`<table><thead><tr><th>Date</th><th>Type</th><th>Description</th><th>Client</th><th class="num">Amount</th></tr></thead><tbody>${state.revenue.sort((a,b)=>(b.date||'').localeCompare(a.date||'')).map(r=>`<tr><td>${esc(r.date)}</td><td>${esc(r.type)}</td><td>${esc(r.description)}</td><td>${esc(r.client)}</td><td class="num">${fmt(r.amount)}</td></tr>`).join('')}</tbody></table>`:'<div class="empty">No revenue entries.</div>'}`}

function renderDrugs(v){const cats=['antibiotic','analgesic','anaesthetic','vaccine','anti-parasitic','NSAID','other'];v.innerHTML=`<div class="section-h"><h2>Drugs & Stock</h2><div class="actions"><button class="btn brass sm" onclick="openModal('addDrug')">+ Drug</button></div></div><div class="kpi-grid"><div class="kpi"><div class="label">Total drug cost</div><div class="val">${fmt(totalDrugCost())}</div></div><div class="kpi"><div class="label">Items</div><div class="val">${state.drugs.length}</div></div></div>${state.drugs.length?`<table><thead><tr><th>Date</th><th>Drug</th><th>Category</th><th>Qty</th><th class="num">Unit cost</th><th class="num">Total</th><th>Supplier</th></tr></thead><tbody>${state.drugs.sort((a,b)=>(b.date||'').localeCompare(a.date||'')).map(d=>`<tr><td>${esc(d.date)}</td><td>${esc(d.name)}</td><td>${esc(d.category)}</td><td>${d.qty}</td><td class="num">${fmt(d.unitCost)}</td><td class="num">${fmt(d.unitCost*d.qty)}</td><td>${esc(d.supplier)}</td></tr>`).join('')}</tbody></table>`:'<div class="empty">No drug entries.</div>'}`}

function renderCD(v){v.innerHTML=`<div class="section-h"><h2>Controlled Drug Register</h2><div class="sub">Misuse of Drugs Regulations 2001</div><div class="actions"><button class="btn brass sm" onclick="openModal('addCD')">+ Entry</button></div></div><div class="card"><p style="font-size:12px;color:var(--cream-dim);line-height:1.6">Schedule 2: bound register, running balance, annual stockcheck, destruction witnessed by authorised person. Schedule 3: safe custody, invoice records. Quarterly reconciliation recommended (RCVS). Register entries must be made on the day of the transaction or the next day.</p></div>${state.cdRegister.length?`<table><thead><tr><th>Date</th><th>Drug</th><th>Schedule</th><th>In/Out</th><th class="num">Qty</th><th class="num">Balance</th><th>Animal/Client</th><th>Vet</th></tr></thead><tbody>${state.cdRegister.sort((a,b)=>(a.date||'').localeCompare(b.date||'')).map(c=>`<tr><td>${esc(c.date)}</td><td>${esc(c.drug)}</td><td>Sch.${c.schedule}</td><td><span class="pill ${c.direction==='in'?'green':'amber'}">${c.direction}</span></td><td class="num">${c.qty}</td><td class="num">${c.balance}</td><td>${esc(c.animal||'')} ${esc(c.client?'('+c.client+')':'')}</td><td>${esc(c.vet)}</td></tr>`).join('')}</tbody></table>`:'<div class="empty">No CD register entries.</div>'}`}

function renderStaff(v){v.innerHTML=`<div class="section-h"><h2>Staff & CPD</h2><div class="actions"><button class="btn brass sm" onclick="openModal('addStaff')">+ Staff</button></div></div>${state.staff.length?`<table><thead><tr><th>Name</th><th>Role</th><th>RCVS no</th><th>CPD hours</th><th>CPD target</th><th>Status</th><th>Indemnity</th><th>DBS</th></tr></thead><tbody>${state.staff.map(s=>{const cpdOk=Number(s.cpdHours||0)>=RULES.rcvsCPDHours;return `<tr><td>${esc(s.name)}</td><td>${esc(s.role)}</td><td style="font-family:var(--mono);font-size:11px">${esc(s.rcvsNumber||'—')}</td><td class="num">${s.cpdHours||0}</td><td class="num">${RULES.rcvsCPDHours}</td><td><span class="pill ${cpdOk?'green':'red'}">${cpdOk?'on track':'behind'}</span></td><td><span class="pill ${s.indemnity?'green':'red'}">${s.indemnity?'yes':'no'}</span></td><td>${esc(s.dbsDate||'—')}</td></tr>`}).join('')}</tbody></table>`:'<div class="empty">No staff.</div>'}`}

function renderRCVS(v){const checks=[
  {id:'pss',name:'Practice Standards Scheme membership',cat:'Registration',req:'Voluntary but recommended. Core, GP, or Hospital tier.'},
  {id:'rcvsReg',name:'All vets RCVS registered and fee paid',cat:'Registration',req:'Annual fee £'+RULES.rcvsAnnualFee+'. Non-payment = removal from register.'},
  {id:'cpd',name:'CPD records current (35 hrs / 3 years)',cat:'CPD',req:'RCVS Code Chapter 3. Plan, Do, Record, Reflect framework.'},
  {id:'indemnity',name:'Professional indemnity insurance',cat:'Insurance',req:'Minimum £'+RULES.indemnityMinCover.toLocaleString()+' recommended. RCVS Code Chapter 8.'},
  {id:'cdRegMaint',name:'Controlled drug register maintained',cat:'Medicines',req:'Misuse of Drugs Regulations 2001. Schedule 2 — bound register, running balance.'},
  {id:'cdSafe',name:'CD safe/cabinet BS2881 compliant',cat:'Medicines',req:'Schedule 2 and 3 drugs: safe custody. Inspected by Home Office.'},
  {id:'cdRecon',name:'CD quarterly reconciliation',cat:'Medicines',req:'RCVS best practice: reconcile stock vs register every '+RULES.cdReconcileWeeks+' weeks.'},
  {id:'consent',name:'Informed consent documented',cat:'Clinical',req:'RCVS Code Chapter 11. Written consent before procedures under GA.'},
  {id:'records',name:'Clinical records adequate and backed up',cat:'Clinical',req:'RCVS Code Chapter 12. Minimum 7 years retention.'},
  {id:'complaints',name:'Complaints procedure documented',cat:'Governance',req:'RCVS Code Chapter 7. Written procedure, accessible to clients.'},
  {id:'ooh',name:'Out-of-hours cover arranged',cat:'Clinical',req:'RCVS Code Chapter 3. 24-hour emergency cover mandatory.'},
  {id:'waste',name:'Clinical waste disposal contract',cat:'Environment',req:'Environmental Protection Act 1990, Hazardous Waste Regulations 2005.'},
  {id:'radiation',name:'Ionising radiation protection (if applicable)',cat:'Safety',req:'IRR 2017 / IRMER 2017. RPA appointed, local rules, dosimetry.'},
  {id:'hs',name:'Health & safety risk assessments',cat:'Safety',req:'HSWA 1974. COSHH, sharps, manual handling, lone working.'},
];
  const done=state.rcvsChecklist||[];
  v.innerHTML=`<div class="section-h"><h2>RCVS Compliance</h2><div class="sub">${done.length}/${checks.length} complete</div></div><div class="check-grid">${checks.map(c=>{const isDone=done.includes(c.id);return `<div class="check-row ${isDone?'done':''}" onclick="toggleCheck('${c.id}')"><span class="mark">${isDone?'✓':'○'}</span><div><strong>${esc(c.name)}</strong><div style="font-size:11px;color:var(--cream-muted)">${esc(c.cat)} · ${esc(c.req)}</div></div></div>`}).join('')}</div>`}
async function toggleCheck(id){if(!state.rcvsChecklist)state.rcvsChecklist=[];const idx=state.rcvsChecklist.indexOf(id);if(idx>=0)state.rcvsChecklist.splice(idx,1);else state.rcvsChecklist.push(id);await persistUI();await auditLog('rcvs.toggle',{payload:{id}});render()}

function renderExpenses(v){v.innerHTML=`<div class="section-h"><h2>Expenses</h2><div class="actions"><button class="btn brass sm" onclick="openModal('addExpense')">+ Expense</button></div></div>${state.expenses.length?`<table><thead><tr><th>Date</th><th>Category</th><th>Description</th><th>Supplier</th><th class="num">Amount</th></tr></thead><tbody>${state.expenses.sort((a,b)=>(b.date||'').localeCompare(a.date||'')).map(e=>`<tr><td>${esc(e.date)}</td><td>${esc(e.category)}</td><td>${esc(e.description)}</td><td>${esc(e.supplier)}</td><td class="num">${fmt(e.amount)}</td></tr>`).join('')}</tbody></table>`:'<div class="empty">No expenses.</div>'}`}

function renderPnL(v){const mRev=monthlyRevenue();const mDrug=monthlyDrugCost();const mExp=monthlyExpenses();const allMonths=[...new Set([...Object.keys(mRev),...Object.keys(mDrug),...Object.keys(mExp)])].sort().slice(-12);
  let tR=0,tD=0,tE=0;
  v.innerHTML=`<div class="section-h"><h2>Practice P&L</h2><div class="sub">rolling 12 months</div></div>${allMonths.length?`<table><thead><tr><th>Month</th><th class="num">Revenue</th><th class="num">Drug costs</th><th class="num">Expenses</th><th class="num">Net</th></tr></thead><tbody>${allMonths.map(m=>{const r=mRev[m]||0;const d=mDrug[m]||0;const e=mExp[m]||0;const n=r-d-e;tR+=r;tD+=d;tE+=e;return `<tr><td>${m}</td><td class="num">${fmt(r)}</td><td class="num">${fmt(d)}</td><td class="num">${fmt(e)}</td><td class="num" style="color:${n>=0?'var(--green)':'var(--red)'};">${fmt(n)}</td></tr>`}).join('')}<tr style="border-top:2px solid var(--brass);font-weight:700"><td>Total</td><td class="num">${fmt(tR)}</td><td class="num">${fmt(tD)}</td><td class="num">${fmt(tE)}</td><td class="num" style="color:${(tR-tD-tE)>=0?'var(--green)':'var(--red)'};">${fmt(tR-tD-tE)}</td></tr></tbody></table>`:'<div class="empty">No data yet.</div>'}`}

const T0_QA=[
  {q:/rcvs|register|conduct|code/i,a:'RCVS (Royal College of Veterinary Surgeons) regulates the veterinary profession under the Veterinary Surgeons Act 1966. Code of Professional Conduct: 10 chapters covering professional responsibility, 24-hour emergency cover, CPD (35 hours/3 years), clinical governance, informed consent, record keeping, referrals, insurance/indemnity, advertising, complaints. Practice Standards Scheme: voluntary accreditation (Core, GP, Hospital). Annual registration fee £394. Fitness to Practise: disciplinary committee can warn, suspend, or remove from register.'},
  {q:/controlled.?drug|cd|schedule|register|ketamine|morphine/i,a:'Misuse of Drugs Regulations 2001 (as amended): Schedule 2 (ketamine, methadone, morphine, pethidine) — bound register, running balance, safe custody (BS2881 cabinet), annual stockcheck, destruction witnessed by authorised person, entries on day of transaction or next day. Schedule 3 (buprenorphine, midazolam) — safe custody, invoice records. Schedule 4 (diazepam, zolazepam) — invoices only. RCVS recommends quarterly reconciliation. Home Office inspections. Records retained 2 years from last entry.'},
  {q:/cpd|training|development|hours/i,a:'RCVS CPD requirement: 35 hours over a rolling 3-year period. All RCVS-registered vets must complete and record CPD. Framework: Plan, Do, Record, Reflect. Must include a mix of learning activities. Non-compliance: may trigger RCVS review. Vet nurses: 45 hours/3 years.'},
  {q:/consent|informed|authoris/i,a:'RCVS Code Chapter 11: obtain informed consent before treatment. Explain diagnosis, prognosis, options, risks, costs. Written consent for procedures under GA. Emergency exception: treat without consent if animal suffering and owner cannot be contacted. Under 16: parental consent. Non-owner: establish authority. Cost estimate and limit should be agreed.'},
  {q:/complaint|dispute|client/i,a:'RCVS Code Chapter 7: every practice must have a written complaints procedure. Must be accessible and displayed. Stages: internal resolution → RCVS if unresolved. Time limits apply. Keep records. VCMS (Veterinary Client Mediation Service) provides free mediation before RCVS formal complaint.'},
  {q:/out.?of.?hours|ooh|emergency|24.?hour/i,a:'RCVS Code Chapter 3: 24-hour emergency cover is mandatory. Options: practice provides OOH cover, or arrangement with another practice/dedicated OOH provider. Must inform clients of arrangements. Emergency triage can be by phone. Location must be within reasonable travel distance.'},
  {q:/insurance|indemnity|cover/i,a:'RCVS Code Chapter 8: professional indemnity insurance is essential. Minimum £5M recommended. Must cover all clinical activities. Locums: check own cover. Practice: ensure vicarious liability covered. Run-off cover needed after retirement/closure.'},
  {q:/record|clinical|notes|retention/i,a:'RCVS Code Chapter 12: maintain adequate clinical records. Include: date, animal ID, owner, findings, treatment, medications, consent. SOAP format recommended. Minimum retention: 7 years. Digital records: must be backed up. Records belong to the practice. Client can request copies (fee chargeable).'},
  {q:/prescrib|dispens|cascade|off.?label/i,a:'Veterinary Medicines Regulations 2013: prescribing cascade — (1) UK authorised veterinary medicine for the species/condition, (2) UK vet medicine for another species/condition, (3) UK human medicine or EU vet medicine, (4) extemporaneous preparation. 7-day standard withdrawal for food animals on cascade. Records of all medicines dispensed. SAVSNET reporting encouraged.'},
  {q:/waste|disposal|sharps|hazardous/i,a:'Environmental Protection Act 1990 / Hazardous Waste Regulations 2005: clinical waste must be segregated (colour-coded bags), stored securely, collected by licensed contractor. Sharps in BS7320 containers. Consignment notes for hazardous waste. Annual returns to Environment Agency. Cytotoxic/cytostatic waste: purple-lidded containers.'},
];
function askT0(q){for(const r of T0_QA){if(r.q.test(q))return {answer:r.a,source:'T0 · UK veterinary rules'}}return null}
async function askT3(q){if(!state.settings.anthropicKey)return null;try{const res=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'x-api-key':state.settings.anthropicKey,'anthropic-version':'2023-06-01','content-type':'application/json'},body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:600,messages:[{role:'user',content:'You are a UK veterinary practice management expert. RCVS, VSA 1966, controlled drugs, VMR 2013, animal welfare. Concise.\n\n'+q}]})});if(!res.ok)return null;const j=await res.json();return {answer:j.content?.[0]?.text,source:'T3 · Anthropic'}}catch(e){return null}}
function renderQA(v){v.innerHTML=`<div class="section-h"><h2>Q & A</h2><div class="sub">T0 + T3 BYOK</div></div><div class="card" style="max-width:780px"><div class="chat" id="chatBox">${(state.ui.chat||[]).map(m=>`<div class="msg ${m.role}">${esc(m.text)}${m.source?`<div class="src">${esc(m.source)}</div>`:''}</div>`).join('')}</div><div class="chat-input"><input id="chatIn" placeholder="Ask… 'CD register rules?' · 'RCVS CPD requirements?' · 'prescribing cascade?'" onkeydown="if(event.key==='Enter')askQ()"><button class="btn brass" onclick="askQ()">Ask</button></div></div>`;const box=$('#chatBox');if(box)box.scrollTop=box.scrollHeight}
async function askQ(){const inp=$('#chatIn');if(!inp)return;const q=inp.value.trim();if(!q)return;inp.value='';if(!state.ui.chat)state.ui.chat=[];state.ui.chat.push({role:'user',text:q});render();let r=askT0(q);if(!r)r=await askT3(q);state.ui.chat.push(r?{role:'bot',text:r.answer,source:r.source}:{role:'bot',text:'No T0 match. Add BYOK key for T3.',source:'system'});persistUI();render()}

function openModal(type){const modal=$('#modal');modal.classList.add('open');
  if(type==='settings'){$('#modalTitle').textContent='Settings';$('#modalBody').innerHTML=`<div class="card"><h3>Practice</h3><div class="row"><div class="field"><label>Name</label><input id="fName" value="${esc(state.firm?.name||'')}"></div><div class="field"><label>RCVS Practice no</label><input id="fRcvs" value="${esc(state.firm?.rcvsNumber||'')}"></div></div><div class="field"><label>Address</label><input id="fAddr" value="${esc(state.firm?.address||'')}"></div><div class="row"><div class="field"><label>Phone</label><input id="fPhone" value="${esc(state.firm?.phone||'')}"></div><div class="field"><label>Email</label><input id="fEmail" value="${esc(state.firm?.email||'')}"></div></div></div><div class="card"><h3>API</h3><div class="field"><label>Anthropic key (T3)</label><input type="password" id="sKey" value="${esc(state.settings.anthropicKey||'')}"></div><div style="margin:10px 0"><label style="font-size:12px"><input type="checkbox" id="sAudit" ${state.settings.auditChain?'checked':''}> Audit chain</label></div></div><div class="actions"><button class="btn ghost sm" onclick="exportAll()">Export</button><button class="btn ghost sm" onclick="importAll()">Import</button><button class="btn danger sm" onclick="wipeAll()">Wipe</button><button class="btn brass" onclick="saveSettings()">Save</button><button class="btn ghost" onclick="closeModal()">Cancel</button></div>`}
  else if(type==='addAppt'){$('#modalTitle').textContent='Add Appointment';$('#modalBody').innerHTML=`<div class="row"><div class="field"><label>Date</label><input type="date" id="aDate"></div><div class="field"><label>Time</label><input type="time" id="aTime"></div></div><div class="row"><div class="field"><label>Client</label><input id="aClient"></div><div class="field"><label>Animal</label><input id="aAnimal"></div></div><div class="row"><div class="field"><label>Vet</label><input id="aVet"></div><div class="field"><label>Type</label><select id="aType"><option>consultation</option><option>vaccination</option><option>surgery</option><option>dental</option><option>follow-up</option><option>emergency</option></select></div></div><div class="row"><div class="field"><label>Fee £</label><input type="number" id="aFee" value="${RULES.consultFee}"></div><div class="field"><label>Status</label><select id="aStatus"><option>booked</option><option>attended</option><option>dna</option><option>cancelled</option></select></div></div><div class="actions"><button class="btn brass" onclick="addAppt()">Add</button><button class="btn ghost" onclick="closeModal()">Cancel</button></div>`}
  else if(type==='addRevenue'){$('#modalTitle').textContent='Add Revenue';$('#modalBody').innerHTML=`<div class="row"><div class="field"><label>Date</label><input type="date" id="rDate"></div><div class="field"><label>Type</label><select id="rType"><option>consultation</option><option>vaccination</option><option>surgery</option><option>dental</option><option>lab</option><option>retail</option><option>other</option></select></div></div><div class="row"><div class="field"><label>Description</label><input id="rDesc"></div><div class="field"><label>Client</label><input id="rClient"></div></div><div class="field"><label>Amount £</label><input type="number" id="rAmt"></div><div class="actions"><button class="btn brass" onclick="addRevenue()">Add</button><button class="btn ghost" onclick="closeModal()">Cancel</button></div>`}
  else if(type==='addDrug'){$('#modalTitle').textContent='Add Drug Purchase';$('#modalBody').innerHTML=`<div class="row"><div class="field"><label>Date</label><input type="date" id="dDate"></div><div class="field"><label>Drug name</label><input id="dName"></div></div><div class="row"><div class="field"><label>Category</label><select id="dCat"><option>antibiotic</option><option>analgesic</option><option>anaesthetic</option><option>vaccine</option><option>anti-parasitic</option><option>NSAID</option><option>other</option></select></div><div class="field"><label>Supplier</label><input id="dSupp"></div></div><div class="row"><div class="field"><label>Quantity</label><input type="number" id="dQty"></div><div class="field"><label>Unit cost £</label><input type="number" step="0.01" id="dCost"></div></div><div class="actions"><button class="btn brass" onclick="addDrug()">Add</button><button class="btn ghost" onclick="closeModal()">Cancel</button></div>`}

function importAll(){const inp=document.createElement('input');inp.type='file';inp.accept='.json';inp.onchange=async()=>{const f=inp.files[0];if(!f)return;try{const d=JSON.parse(await f.text());if(d.firm){state.firm=d.firm;await idbPut('firms',d.firm)}for(const k of['appointments','revenue','drugs','cdRegister','staff','expenses']){if(Array.isArray(d[k]))for(const r of d[k]){state[k].push(r);await idbPut(k,r)}}persistUI();toast('Imported');render()}catch(e){toast('Failed')}};inp.click()}
async function wipeAll(){if(!confirm('Wipe ALL data?'))return;for(const s of['firms','appointments','revenue','drugs','cdRegister','staff','expenses','audit','state']){const tx=db.transaction(s,'readwrite');tx.objectStore(s).clear();await new Promise(r=>{tx.oncomplete=r})}location.reload()}
